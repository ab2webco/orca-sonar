<!--
  Sonar usage panel (left sidebar). Orca renders it in a sandboxed frame with
  an opaque origin. It only reads what the worker publishes in plugin storage:
  `usage` (the CLI's `usage --json` summary of the last 30 days) and `state`
  (when the worker last checked). The saving is an estimate and the panel
  states its formula, which lives in src/core/savings.ts. Every colour is one
  of the tokens Orca injects.
-->
<style>
  html,
  body {
    background: var(--background);
    color: var(--foreground);
  }
  body {
    margin: 0;
    padding: 16px;
  }
  main {
    max-width: 1040px;
    margin: 0 auto;
    display: grid;
    gap: 12px;
  }
  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }
  .hint {
    margin: 0;
    color: var(--muted-foreground);
    font-size: 13px;
    overflow-wrap: anywhere;
  }
  section {
    background: var(--card);
    color: var(--card-foreground);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px;
    min-width: 0;
  }
  h2 {
    margin: 0 0 8px;
    font-size: 14px;
    font-weight: 600;
  }
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
  }
  .tile {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 12px 14px;
    min-width: 0;
  }
  .tile .label {
    color: var(--muted-foreground);
    font-size: 12px;
  }
  .tile .value {
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }
  .tile .detail {
    color: var(--muted-foreground);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .tile.estimate .label::after {
    content: '\00a0*';
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    margin: 0 0 10px;
    font-size: 12px;
    color: var(--muted-foreground);
  }
  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
  }
  .find {
    background: var(--primary);
  }
  .symbol {
    background: var(--muted-foreground);
  }
  .chart {
    position: relative;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    gap: 0 8px;
  }
  .axis {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 160px;
    font-size: 11px;
    color: var(--muted-foreground);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .plot {
    height: 160px;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    border-bottom: 1px solid var(--border);
    background-image: linear-gradient(var(--border) 1px, transparent 1px);
    background-size: 100% 50%;
  }
  .day {
    flex: 1 1 0;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 2px;
    cursor: default;
    outline: none;
  }
  .day:hover,
  .day:focus-visible {
    background: var(--muted);
  }
  .day:focus-visible {
    box-shadow: inset 0 0 0 2px var(--ring);
  }
  .bar {
    width: 100%;
    max-width: 18px;
    margin: 0 auto;
  }
  .bar.top {
    border-radius: 4px 4px 0 0;
  }
  .ticks {
    grid-column: 2;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted-foreground);
    margin-top: 4px;
  }
  .tooltip {
    position: absolute;
    z-index: 1;
    pointer-events: none;
    background: var(--popover, var(--card));
    color: var(--popover-foreground, var(--card-foreground));
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 6px 8px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgb(0 0 0 / 0.12);
  }
  details {
    margin-top: 10px;
    font-size: 13px;
  }
  summary {
    cursor: pointer;
    color: var(--muted-foreground);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }
  th,
  td {
    text-align: right;
    padding: 3px 6px;
    border-bottom: 1px solid var(--border);
  }
  th:first-child,
  td:first-child {
    text-align: left;
  }
  th {
    font-weight: 500;
    color: var(--muted-foreground);
  }
  .formula {
    margin: 6px 0 0;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    background: var(--muted);
    font-family: var(--font-mono, ui-monospace, monospace);
    font-size: 12px;
    overflow-wrap: anywhere;
  }
  .formula span {
    display: block;
  }
  .formula span + span {
    margin-top: 4px;
  }
  .note {
    margin: 0;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--muted);
    font-size: 13px;
  }
  [hidden] {
    display: none !important;
  }
</style>

<main>
  <header>
    <h1 id="title"></h1>
    <p class="hint" id="subtitle"></p>
  </header>

  <p class="note" id="message" hidden></p>

  <div class="tiles" id="tiles" hidden>
    <div class="tile">
      <div class="label" id="queries-label"></div>
      <div class="value" id="queries"></div>
      <div class="detail" id="queries-detail"></div>
    </div>
    <div class="tile">
      <div class="label" id="time-label"></div>
      <div class="value" id="time"></div>
    </div>
    <div class="tile">
      <div class="label" id="results-label"></div>
      <div class="value" id="results"></div>
    </div>
    <div class="tile">
      <div class="label" id="workspaces-label"></div>
      <div class="value" id="workspaces"></div>
      <div class="detail" id="workspaces-detail"></div>
    </div>
    <div class="tile estimate">
      <div class="label" id="saving-label"></div>
      <div class="value" id="saving"></div>
      <div class="detail" id="saving-detail"></div>
    </div>
  </div>

  <section id="per-day" hidden>
    <h2 id="chart-title"></h2>
    <div class="legend">
      <span><span class="swatch find"></span><span id="legend-find"></span></span>
      <span><span class="swatch symbol"></span><span id="legend-symbol"></span></span>
    </div>
    <div class="chart" id="chart">
      <div class="axis" aria-hidden="true">
        <span id="axis-max"></span><span id="axis-mid"></span><span>0</span>
      </div>
      <div class="plot" id="plot"></div>
      <div class="ticks" aria-hidden="true">
        <span id="tick-first"></span><span id="tick-last"></span>
      </div>
      <div class="tooltip" id="tooltip" role="status" hidden></div>
    </div>
    <details>
      <summary id="table-toggle"></summary>
      <table>
        <thead>
          <tr>
            <th id="th-day"></th>
            <th id="th-find"></th>
            <th id="th-symbol"></th>
          </tr>
        </thead>
        <tbody id="table"></tbody>
      </table>
    </details>
  </section>

  <section id="method" hidden>
    <h2 id="method-title"></h2>
    <p class="hint" id="method-intro"></p>
    <div class="formula" id="formula"></div>
    <p class="hint" id="method-totals" style="margin-top: 8px"></p>
  </section>
</main>

<script>
  'use strict'

  var TEXT = {
    en: {
      title: 'Sonar usage',
      subtitle: 'Last 30 days, from the lookups agents ran through Sonar. Updated {when}.',
      subtitleNever: 'Last 30 days.',
      neverChecked:
        'No statistics yet. Sonar gathers them on the next agent activity in Orca; to gather them now, run “Sonar: Refresh” from the command palette.',
      noQueries:
        'No lookups in the last 30 days. Statistics appear here once agents use orca sonar find or orca sonar symbol.',
      bridgeFailed: 'This panel could not reach Orca.',
      queries: 'Queries',
      queriesDetail: '{find} find · {symbol} symbol',
      time: 'Average query time',
      results: 'Results returned',
      workspaces: 'Workspaces indexed',
      workspacesDetail: '{count} queried',
      saving: 'Tokens saved, estimated',
      savingDetail: '{bytes} less than grep',
      chartTitle: 'Queries per day',
      find: 'find',
      symbol: 'symbol',
      tooltip: '{day}: {find} find, {symbol} symbol',
      table: 'Show as a table',
      day: 'Day',
      methodTitle: '* How the saving is estimated',
      methodIntro:
        'For each lookup Sonar compares what it printed with what an agent would have read using grep and then opening the files that hold the results. It is an estimate, not a measurement.',
      formula: [
        'baseline = grep output (path:line:text for each matching line, counting up to 2,000 lines) + size of the files holding Sonar’s results',
        'saving = baseline − Sonar’s output, never below 0',
        'tokens ≈ saving ÷ 4 bytes'
      ],
      methodTotals: 'In this period: baseline {baseline}, Sonar printed {output}, saving {saved}.',
      ms: '{value} ms',
      bytes: ['B', 'KB', 'MB', 'GB']
    },
    es: {
      title: 'Uso de Sonar',
      subtitle:
        'Últimos 30 días, con las búsquedas que hicieron los agentes con Sonar. Actualizado {when}.',
      subtitleNever: 'Últimos 30 días.',
      neverChecked:
        'Aún no hay estadísticas. Sonar las reúne con la próxima actividad de un agente en Orca; para reunirlas ya, ejecuta “Sonar: Refresh” desde la paleta de comandos.',
      noQueries:
        'No hubo búsquedas en los últimos 30 días. Las estadísticas aparecen aquí cuando los agentes usen orca sonar find u orca sonar symbol.',
      bridgeFailed: 'Este panel no pudo comunicarse con Orca.',
      queries: 'Consultas',
      queriesDetail: '{find} find · {symbol} symbol',
      time: 'Tiempo medio por consulta',
      results: 'Resultados devueltos',
      workspaces: 'Espacios de trabajo indexados',
      workspacesDetail: '{count} consultados',
      saving: 'Tokens ahorrados, estimado',
      savingDetail: '{bytes} menos que con grep',
      chartTitle: 'Consultas por día',
      find: 'find',
      symbol: 'symbol',
      tooltip: '{day}: {find} find, {symbol} symbol',
      table: 'Ver como tabla',
      day: 'Día',
      methodTitle: '* Cómo se estima el ahorro',
      methodIntro:
        'En cada búsqueda Sonar compara lo que imprimió con lo que un agente habría leído usando grep y abriendo luego los archivos con los resultados. Es una estimación, no una medición.',
      formula: [
        'base = salida de grep (ruta:línea:texto por cada línea que coincide, contando hasta 2000 líneas) + tamaño de los archivos con los resultados de Sonar',
        'ahorro = base − salida de Sonar, nunca menos de 0',
        'tokens ≈ ahorro ÷ 4 bytes'
      ],
      methodTotals: 'En este periodo: base {baseline}, Sonar imprimió {output}, ahorro {saved}.',
      ms: '{value} ms',
      bytes: ['B', 'KB', 'MB', 'GB']
    }
  }

  var LANG = (document.documentElement.lang || navigator.language || 'en').toLowerCase()
  var LOCALE = LANG.indexOf('es') === 0 ? 'es' : 'en'
  var T = TEXT[LOCALE]
  var POLL_MS = 30000
  var REPLY_TIMEOUT_MS = 8000

  function $(id) {
    return document.getElementById(id)
  }

  function fill(text, values) {
    return text.replace(/\{(\w+)\}/g, function (match, name) {
      return values && values[name] !== undefined ? String(values[name]) : match
    })
  }

  // ---- bridge -------------------------------------------------------------

  var pending = {}
  var nextId = 0

  window.addEventListener('message', function (event) {
    var data = event.data
    if (!data || data.type !== 'orca-panel-action-result' || !pending[data.requestId]) return
    var entry = pending[data.requestId]
    delete pending[data.requestId]
    clearTimeout(entry.timer)
    if (data.ok) entry.resolve(data.value)
    else entry.reject(new Error(data.error || data.errorCode || 'failed'))
  })

  function call(action, params) {
    return new Promise(function (resolve, reject) {
      nextId += 1
      var requestId = 'sonar-' + String(Date.now()) + '-' + String(nextId)
      var timer = setTimeout(function () {
        delete pending[requestId]
        reject(new Error('timeout'))
      }, REPLY_TIMEOUT_MS)
      pending[requestId] = { resolve: resolve, reject: reject, timer: timer }
      window.parent.postMessage(
        { type: 'orca-panel-action', requestId: requestId, action: action, params: params || {} },
        '*'
      )
    })
  }

  function readKey(key) {
    return call('storage.get', { key: key }).then(function (result) {
      return result && typeof result === 'object' ? result.value : null
    })
  }

  // ---- formatting ---------------------------------------------------------

  var numberFormat = new Intl.NumberFormat(LOCALE)
  var compactFormat = new Intl.NumberFormat(LOCALE, {
    notation: 'compact',
    maximumFractionDigits: 1
  })
  var relative = new Intl.RelativeTimeFormat(LOCALE, { numeric: 'auto' })
  var dayFormat = new Intl.DateTimeFormat(LOCALE, { month: 'short', day: 'numeric' })

  function when(iso) {
    var time = Date.parse(iso)
    if (!isFinite(time)) return ''
    var seconds = Math.round((time - Date.now()) / 1000)
    if (Math.abs(seconds) < 60) return relative.format(seconds, 'second')
    if (Math.abs(seconds) < 3600) return relative.format(Math.round(seconds / 60), 'minute')
    if (Math.abs(seconds) < 86400) return relative.format(Math.round(seconds / 3600), 'hour')
    return relative.format(Math.round(seconds / 86400), 'day')
  }

  function bytes(count) {
    var value = count
    var unit = 0
    while (value >= 1024 && unit < T.bytes.length - 1) {
      value /= 1024
      unit += 1
    }
    var digits = unit === 0 || value >= 100 ? 0 : 1
    return (
      new Intl.NumberFormat(LOCALE, { maximumFractionDigits: digits }).format(value) +
      ' ' +
      T.bytes[unit]
    )
  }

  /** A local YYYY-MM-DD day as a short date. */
  function dayLabel(day) {
    var parts = String(day).split('-')
    return dayFormat.format(new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2])))
  }

  function number(value) {
    return typeof value === 'number' && isFinite(value) ? value : 0
  }

  // ---- rendering ----------------------------------------------------------

  var view = { loaded: false, failed: false, usage: null, checkedAt: null }

  function showMessage(text) {
    $('message').textContent = text
    $('message').hidden = !text
  }

  function renderChart(days) {
    var plot = $('plot')
    plot.textContent = ''
    var table = $('table')
    table.textContent = ''
    var max = 0
    days.forEach(function (entry) {
      max = Math.max(max, number(entry.find) + number(entry.symbol))
    })
    var top = Math.max(2, Math.ceil(max / 2) * 2)
    $('axis-max').textContent = numberFormat.format(top)
    $('axis-mid').textContent = numberFormat.format(top / 2)
    $('tick-first').textContent = days.length ? dayLabel(days[0].day) : ''
    $('tick-last').textContent = days.length ? dayLabel(days[days.length - 1].day) : ''

    days.forEach(function (entry) {
      var find = number(entry.find)
      var symbol = number(entry.symbol)
      var label = fill(T.tooltip, {
        day: dayLabel(entry.day),
        find: numberFormat.format(find),
        symbol: numberFormat.format(symbol)
      })
      var column = document.createElement('div')
      column.className = 'day'
      column.tabIndex = 0
      column.setAttribute('role', 'img')
      column.setAttribute('aria-label', label)
      // Stacked from the baseline: find at the bottom, symbol on top.
      var segments = [
        { value: symbol, className: 'symbol' },
        { value: find, className: 'find' }
      ].filter(function (segment) {
        return segment.value > 0
      })
      segments.forEach(function (segment, index) {
        var bar = document.createElement('div')
        bar.className = 'bar ' + segment.className + (index === 0 ? ' top' : '')
        bar.style.height = String((segment.value / top) * 100) + '%'
        column.appendChild(bar)
      })
      column.addEventListener('mouseenter', function () {
        showTooltip(column, label)
      })
      column.addEventListener('focus', function () {
        showTooltip(column, label)
      })
      column.addEventListener('mouseleave', hideTooltip)
      column.addEventListener('blur', hideTooltip)
      plot.appendChild(column)

      var row = document.createElement('tr')
      ;[dayLabel(entry.day), numberFormat.format(find), numberFormat.format(symbol)].forEach(
        function (text) {
          var cell = document.createElement('td')
          cell.textContent = text
          row.appendChild(cell)
        }
      )
      table.appendChild(row)
    })
  }

  function showTooltip(column, label) {
    var tooltip = $('tooltip')
    var chart = $('chart')
    tooltip.textContent = label
    tooltip.hidden = false
    var chartBox = chart.getBoundingClientRect()
    var columnBox = column.getBoundingClientRect()
    var left = columnBox.left - chartBox.left + columnBox.width / 2 - tooltip.offsetWidth / 2
    tooltip.style.left =
      String(Math.max(0, Math.min(left, chartBox.width - tooltip.offsetWidth))) + 'px'
    tooltip.style.top = '-8px'
  }

  function hideTooltip() {
    $('tooltip').hidden = true
  }

  function render() {
    var usage = view.usage
    var totals = usage && usage.totals ? usage.totals : null
    var days = usage && Array.isArray(usage.days) ? usage.days : []
    $('subtitle').textContent = view.checkedAt
      ? fill(T.subtitle, { when: when(view.checkedAt) })
      : T.subtitleNever

    if (view.failed) showMessage(T.bridgeFailed)
    else if (!view.loaded) showMessage('')
    else if (!totals) showMessage(T.neverChecked)
    else if (number(totals.queries) === 0) showMessage(T.noQueries)
    else showMessage('')

    var hasData = Boolean(totals) && !view.failed
    $('tiles').hidden = !hasData
    $('per-day').hidden = !hasData || number(totals && totals.queries) === 0
    $('method').hidden = !hasData
    if (!hasData) return

    $('queries').textContent = numberFormat.format(number(totals.queries))
    $('queries-detail').textContent = fill(T.queriesDetail, {
      find: numberFormat.format(number(totals.find)),
      symbol: numberFormat.format(number(totals.symbol))
    })
    $('time').textContent =
      totals.averageMs === null || totals.averageMs === undefined
        ? '—'
        : fill(T.ms, { value: numberFormat.format(Math.round(totals.averageMs)) })
    $('results').textContent = numberFormat.format(number(totals.results))
    $('workspaces').textContent = numberFormat.format(number(usage.workspacesIndexed))
    $('workspaces-detail').textContent = fill(T.workspacesDetail, {
      count: numberFormat.format(number(usage.workspacesQueried))
    })
    $('saving').textContent = compactFormat.format(number(totals.savedTokens))
    $('saving-detail').textContent = fill(T.savingDetail, {
      bytes: bytes(number(totals.savedBytes))
    })
    $('method-totals').textContent = fill(T.methodTotals, {
      baseline: bytes(number(totals.baselineBytes)),
      output: bytes(number(totals.outputBytes)),
      saved: bytes(number(totals.savedBytes))
    })
    renderChart(days)
  }

  function load() {
    return Promise.all([readKey('usage'), readKey('state')])
      .then(function (results) {
        view.usage = results[0] && typeof results[0] === 'object' ? results[0] : null
        var state = results[1]
        view.checkedAt = state && typeof state.checkedAt === 'string' ? state.checkedAt : null
        view.loaded = true
        view.failed = false
      })
      .catch(function () {
        view.failed = true
      })
      .then(render)
  }

  $('title').textContent = T.title
  $('queries-label').textContent = T.queries
  $('time-label').textContent = T.time
  $('results-label').textContent = T.results
  $('workspaces-label').textContent = T.workspaces
  $('saving-label').textContent = T.saving
  $('chart-title').textContent = T.chartTitle
  $('legend-find').textContent = T.find
  $('legend-symbol').textContent = T.symbol
  $('table-toggle').textContent = T.table
  $('th-day').textContent = T.day
  $('th-find').textContent = T.find
  $('th-symbol').textContent = T.symbol
  $('method-title').textContent = T.methodTitle
  $('method-intro').textContent = T.methodIntro
  T.formula.forEach(function (line) {
    var span = document.createElement('span')
    span.textContent = line
    $('formula').appendChild(span)
  })

  render()
  load()
  setInterval(load, POLL_MS)
</script>
